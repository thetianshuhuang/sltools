[project]
name = "sltools"
version = "0.1.0"
description = "A collection of Slurm tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=14.2.0",
    "tyro>=1.0.3",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.0.0",
    "ruff>=0.10.0"
]

[project.scripts]
sltop = "sltools.sltop:_cli"
slreserve = "sltools.reserve:_cli"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = [
    "E", "F", "W", "N", "I", "D", "NPY"
]
ignore = [
    "D102",  # Inheriting docstrings is allowed
    "D107",  # Initializer goes in the class docstring
    "D401",  # "Imperative mood" NLP doesn't always make sense
    "D413",  # No blank lines after section is preferred by mkdocstrings
    "E402",  # Module level imports sometimes need to occur after configuration

    # Must pick one...
    "D213",  # Pick 'multi-line-summary-first-line'.
    "D203",  # Pick `no-blank-line-before-class`.
]
